name: Infrastructure-E2E

# Calls the shared E2E workflow in Infrastructure-E2E as a required PR check.
# Always runs the full lifecycle layer - a provisioner change can cascade to
# break user setup or runner registration, so the full stack must be verified.
on:
  pull_request:

jobs:
  e2e:
    uses: Klark-Morrigan/Infrastructure-E2E/.github/workflows/e2e.yml@master
    # Exercise this repo's own two Ansible paths on every PR, since it owns
    # both: toolchainsFlow=ansible drives provision -SkipToolchains + the
    # standalone provision-toolchains.sh, and filesFlow=ansible drives
    # provision -SkipFiles + provision-files.sh, the way this repo now
    # installs toolchains and transports files. users/runners stay on their
    # ansible defaults. Every ansible layer needs WslDistro in the E2EConfig
    # vault. This pin does not cover the in-line PowerShell file transport -
    # set filesFlow to 'custom-powershell' for that.
    with:
      flow-spec: >-
        {
          "usersFlow":"ansible",
          "runnersFlow":"ansible",
          "toolchainsFlow":"ansible",
          "filesFlow":"ansible"
        }
    secrets: inherit
